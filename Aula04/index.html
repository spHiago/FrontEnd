<!DOCTYPE html>
<html lang "pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title> ## </title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="topbar">
            <div class="container nav-wrapper">
                <div class=="brand"> ####</div>
                <nav class="nav" aria-label="Menu Principal">
                    <a href="#inicio">Início</a>
                </nav>
            </div>
        </header>

        <main class="container" id="inicio">
            <section class="hero">
                <div class="hero-copy">
                    <p class="eyebrow"> Voce é fraco, lhe falta html</p>
                    <h1> Cadastre seus animes favoritos</h1>
                    <p class="subtitle">
                        Conectamos preferencias de gostos de acordo com a comunidade.
                    </p>
                </div>
            </section>

            <section class="from-card" id="cadastro">
                <h2> Cadastre seus animes</h2>
                <form action+="https://postman-echo.com/post" method="post" enctype="multipart/form-data"> 
                    <fieldset>
                        <legend>Dados</legend>

                        <div class="form-group">
                            <label for="nome_id">Nome do Anime:</label>
                            <input
                            type="text"
                            id="nome_id"
                            name="nome"
                            placeholder="Digite o titulo do anime"
                            required/>
                        </div>

                        <div class="form-group">
                            <label for="categoria_id">Categoria:</label>
                            <select id="categoria_id" name="categoria" required>
                                <option value="">Selecione uma categoria</option>
                                <option value="acao">Ação</option>
                                <option value="comedia">Comédia</option>
                                <option value="drama">Drama</option>
                                <option value="isekai">Isekai</option>
                                <option value="terror">Terror</option>
                            </select>
                        </div>
                    </fieldset>
            </section>
        </main>
    </body>
</html>
