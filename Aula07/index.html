<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/global.css">
    <script src="./scripts/index.js" defer></script>
    <title>Formulário JS</title>
</head>

<body>

    <header>
        <h1>Formulário super simples</h1>
    </header>
    <main>
        <h2>Cadastro</h2>
        <form id="cadastro" novalidate onsubmit="executar(event)">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">
            <span id="erro-nome" class="oculto"></span>

            <label for="idade">Idade:</label>
            <input type="number" min="0" 
            
            id="idade" name="idade">
            <span id="erro-idade" class="oculto"></span>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <p id="erro-email" class="oculto"></p>

            <label>
                <input type="checkbox" id="termos">
                Li e aceito os termos
                <p id="erro-termos" class="oculto"></p>
            </label>

            <button type="submit">Enviar</button>
            <p id="concluído" class="oculto"></p>
        </form>
    </main>

</body>

<footer>
    <p>Desenvolvido por Hiago, 2026</p>
</footer>

</html>
