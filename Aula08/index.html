<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/global.css">
  <script src="scripts/index.js" defer></script>
  <title>Formulário JS</title>
</head>

<body>
  <header>
    <h1>Formulário super simples</h1>
  </header>
  <main>
    <h2>Cadastro</h2>
    <form id="cadastro" novalidate onsubmit="executar(event)">
      <label for="nome">Nome*</label>
      <input type="text" id="nome">
      <p id="erro-nome" class="oculto"></p>

      <label for="idade">Idade*</label>
      <input type="number" id="idade">
      <p id="erro-idade" class="oculto"></p>

      <label for="Celular">Celular*</label>
      <input type="text" id="celular" oninput="mascararCelular(event)">
      <p id="erro-celular" class="oculto"></p>


      <label for="email">Email*</label>
      <input type="email" id="email">
      <p id="erro-email" class="oculto"></p>

      <label for="sexo">Sexo</label>
      <select id="sexo">
        <option value="">Selecione</option>
        <option value="masculino">Masculino</option>
        <option value="feminino">Feminino</option>
        <option value="transformers">Transformers Optimus Prime</option>
      </select>
      <p id="erro-sexo" class="oculto"></p>

      <label for="nacionalidade">Nacionalidade</label>
      <input type="text" id="nacionalidade">
      <p id="erro-nacionalidade" class="oculto"></p>

      <label for="estado-civil">Estado Civil</label>
      <select id="estado-civil">
        <option value="">Selecione</option>
        <option value="solteiro">Solteiro</option>
        <option value="casado">Casado</option>
        <option value="viuvo">Viuvo</option>
        <option value="triste">Triste</option>
        <option value="passando-fome">Passando Fome</option>
      </select>
      <p id="erro-estado-civil" class="oculto"></p>

      <label>
        <input type="checkbox" id="termos">
        Li e aceito os termos
        <p id="erro-termos" class="oculto"></p>
      </label>

      <button type="submit">Enviar</button>
      <p id="concluido" class="oculto"></p>

    </form>
  </main>
  <footer>
    <p>Projeto para conhecermos o JavaScript</p>
  </footer>
</body>

</html>
